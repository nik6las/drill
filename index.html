<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

<!-- PWA / iOS standalone -->
<title>Drill</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Drill">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
  :root{
    --bg:#ffffff;
    --fg:#111111;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#3538cd;      /* single accent: indigo */
    --wrong:#d11a2a;
    --ok:#0f9d58;         /* only used for the partial-progress flash */
    --btn:#f4f4f5;
    --btn-active:#e4e4e7;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  /* tabular numerals everywhere numbers matter */
  .num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

  .app{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    max-width:560px; margin:0 auto;
  }
  .view{ display:none; flex:1; min-height:0; flex-direction:column; }
  .view.active{ display:flex; }

  /* ---------------- HOME ---------------- */
  #home{ padding:max(20px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom)); overflow-y:auto; }
  .brand{ font-size:15px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--fg); margin:6px 0 26px; }
  .grouplabel{ font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .chip{
    flex:1 1 0; min-width:64px;
    border:1.5px solid var(--line); background:var(--bg); color:var(--fg);
    border-radius:12px; padding:13px 6px; font-size:16px; font-weight:600;
    cursor:pointer; touch-action:manipulation;
  }
  .chip[aria-pressed="true"]{ border-color:var(--accent); color:var(--accent); }
  .start{
    width:100%; border:none; background:var(--accent); color:#fff;
    border-radius:14px; padding:20px; font-size:21px; font-weight:700;
    cursor:pointer; touch-action:manipulation; margin-top:6px;
  }
  .start:active{ filter:brightness(.92); }
  .start:disabled{ opacity:.38; cursor:default; filter:none; }

  .factsrow{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .factsum{ flex:1; font-size:16px; font-weight:600; }
  .factsum.none{ color:var(--wrong); }
  .gear{
    flex:none; width:48px; height:48px; border:1.5px solid var(--line);
    background:var(--bg); border-radius:12px; font-size:19px; line-height:1;
    cursor:pointer; touch-action:manipulation;
  }
  .gear:active{ background:var(--btn); }

  /* ---------------- SETTINGS ---------------- */
  #settings{ padding-top:max(10px,env(safe-area-inset-top)); }
  .setbody{ flex:1; min-height:0; overflow-y:auto; padding:0 14px 8px; }
  .setfoot{ padding:8px 14px calc(12px + env(safe-area-inset-bottom)); }
  .hintline{ font-size:13px; color:var(--muted); margin:0 0 10px; }
  .fgrid{ display:grid; grid-template-columns:repeat(16,1fr); gap:2px; }
  .fcell{
    aspect-ratio:1; padding:0; border:none; border-radius:3px;
    background:var(--btn); cursor:pointer; touch-action:manipulation;
  }
  .fcell.on{ background:var(--accent); }
  .fhead, .fcorner{
    aspect-ratio:1; padding:0; border:none; background:none; color:var(--muted);
    font-size:clamp(9px,2.6vw,13px); font-weight:700; cursor:pointer;
    touch-action:manipulation; display:flex; align-items:center; justify-content:center;
  }
  .fhead:active, .fcorner:active{ color:var(--accent); }

  .hist{ margin-top:34px; }
  .hist h2{ font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .histrow{ display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .histrow .meta{ color:var(--muted); }
  .histrow .res{ font-weight:700; }
  .histempty{ color:var(--muted); font-size:15px; padding:8px 0; }
  .footer{ margin-top:28px; text-align:center; }
  .reset{ background:none; border:none; color:var(--muted); font-size:13px; text-decoration:underline; cursor:pointer; padding:8px; }

  /* ---------------- DRILL ---------------- */
  #drill{ padding-top:max(10px,env(safe-area-inset-top)); }
  .bar{ display:flex; align-items:center; justify-content:space-between; padding:8px 18px; height:48px; }
  .quit{ background:none; border:none; font-size:24px; line-height:1; color:var(--muted); cursor:pointer; width:44px; height:44px; touch-action:manipulation; }
  .status{ font-size:22px; font-weight:700; }
  .status.timer{ color:var(--accent); }
  .status.timer.low{ color:var(--wrong); }
  .score{ font-size:16px; font-weight:600; color:var(--muted); width:44px; text-align:right; }

  .stage{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:0 16px; }
  .problem{ font-size:clamp(3rem,19vw,6.5rem); font-weight:700; letter-spacing:-.02em; line-height:1; text-align:center; }
  .answerbox{ font-size:clamp(2rem,12vw,4rem); font-weight:600; min-height:1.2em; line-height:1.2; color:var(--accent); }
  .answerbox.empty{ color:var(--line); }
  .answerbox.bad{ color:var(--wrong); }
  .answerbox.good{ color:var(--ok); }
  .hint{ font-size:clamp(1.1rem,5vw,1.6rem); color:var(--fg); min-height:1.4em; font-weight:700; }

  .revealrow{ display:flex; justify-content:center; padding:2px 12px 6px; }
  .showbtn{
    border:1.5px solid var(--line); background:var(--bg); color:var(--muted);
    border-radius:10px; padding:11px 22px; font-size:15px; font-weight:600;
    cursor:pointer; touch-action:manipulation;
  }
  .showbtn:active{ background:var(--btn); }
  .showbtn.hidden{ visibility:hidden; }

  .pad{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    padding:8px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .key{
    border:none; background:var(--btn); color:var(--fg);
    border-radius:12px; font-size:clamp(1.5rem,7vw,2rem); font-weight:600;
    height:clamp(58px,9.5vh,82px); cursor:pointer; touch-action:manipulation;
  }
  .key:active{ background:var(--btn-active); }
  .key.op{ background:none; color:var(--accent); font-size:1.6rem; }
  .key.op:active{ background:var(--btn); }
  .key.op.hidden{ visibility:hidden; }
  .key.back{ font-size:1.6rem; }

  /* ---------------- RESULTS ---------------- */
  #results{ padding:max(20px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom)); overflow-y:auto; justify-content:flex-start; }
  .rspace{ flex:1; min-height:14px; }
  .bignum{ font-size:clamp(4rem,26vw,8rem); font-weight:700; line-height:1; text-align:center; letter-spacing:-.02em; }
  .blabel{ text-align:center; font-size:17px; color:var(--muted); margin-top:8px; }
  .acc{ text-align:center; font-size:17px; margin-top:22px; font-weight:600; }
  .missed{ margin-top:26px; }
  .missed h3{ font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
  .misschips{ display:flex; flex-wrap:wrap; gap:8px; }
  .miss{ border:1.5px solid var(--line); border-radius:10px; padding:8px 12px; font-size:16px; font-weight:600; }
  .nomiss{ color:var(--muted); font-size:15px; }
  .ractions{ display:flex; gap:10px; margin-top:30px; }
  .ractions button{ flex:1; border-radius:14px; padding:18px; font-size:18px; font-weight:700; cursor:pointer; touch-action:manipulation; }
  .again{ border:none; background:var(--accent); color:#fff; }
  .again:active{ filter:brightness(.92); }
  .home{ border:1.5px solid var(--line); background:var(--bg); color:var(--fg); }
  .home:active{ background:var(--btn); }
</style>
</head>
<body>
<div class="app">

  <!-- ================= HOME ================= -->
  <section id="home" class="view active">
    <div class="brand">Drill</div>

    <div class="grouplabel">Drill</div>
    <div class="chips" id="opChips"></div>

    <div class="grouplabel">Facts</div>
    <div class="factsrow">
      <div class="factsum num" id="factSummary"></div>
      <button class="gear" id="gearBtn" aria-label="Edit facts">&#9881;</button>
    </div>

    <div class="grouplabel">Mode</div>
    <div class="chips" id="modeChips"></div>

    <button class="start" id="startBtn">Start</button>

    <div class="hist">
      <h2>Recent</h2>
      <div id="histList"></div>
    </div>

    <div class="footer">
      <button class="reset" id="resetBtn">Clear history &amp; mistakes</button>
    </div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section id="settings" class="view">
    <div class="bar">
      <button class="quit" id="setBack" aria-label="Back">&#8592;</button>
      <div class="status num" id="setCount">0</div>
      <div class="score">&nbsp;</div>
    </div>

    <div class="setbody">
      <div class="grouplabel">Presets</div>
      <div class="chips" id="presetChips"></div>

      <div class="grouplabel">Facts</div>
      <p class="hintline">Tap a cell to toggle one fact. Tap a row or column number to toggle the whole line, or &times; to select all / clear.</p>
      <div class="fgrid" id="fgrid"></div>
    </div>

    <div class="setfoot">
      <button class="start" id="setDone">Done</button>
    </div>
  </section>

  <!-- ================= DRILL ================= -->
  <section id="drill" class="view">
    <div class="bar">
      <button class="quit" id="quitBtn" aria-label="Quit">&times;</button>
      <div class="status num" id="status">60</div>
      <div class="score num" id="scoreLabel">0</div>
    </div>

    <div class="stage">
      <div class="problem num" id="problem">&nbsp;</div>
      <div class="answerbox num empty" id="answer">&nbsp;</div>
      <div class="hint num" id="hint">&nbsp;</div>
    </div>

    <div class="revealrow">
      <button class="showbtn" id="showBtn">Show answer</button>
    </div>

    <div class="pad" id="pad">
      <button class="key num" data-k="1">1</button>
      <button class="key num" data-k="2">2</button>
      <button class="key num" data-k="3">3</button>
      <button class="key num" data-k="4">4</button>
      <button class="key num" data-k="5">5</button>
      <button class="key num" data-k="6">6</button>
      <button class="key num" data-k="7">7</button>
      <button class="key num" data-k="8">8</button>
      <button class="key num" data-k="9">9</button>
      <button class="key op" id="opKey" data-k="next" aria-label="Next factor">&times;</button>
      <button class="key num" data-k="0">0</button>
      <button class="key back" data-k="back" aria-label="Delete">&#9003;</button>
    </div>
  </section>

  <!-- ================= RESULTS ================= -->
  <section id="results" class="view">
    <div class="rspace"></div>
    <div class="bignum num" id="rBig">0</div>
    <div class="blabel" id="rLabel"></div>
    <div class="acc num" id="rAcc"></div>

    <div class="missed">
      <h3>Missed</h3>
      <div class="misschips" id="rMissed"></div>
    </div>

    <div class="ractions">
      <button class="home" id="rHome">Home</button>
      <button class="again" id="rAgain">Again</button>
    </div>
    <div class="rspace"></div>
  </section>

</div>

<script>
"use strict";
/* =========================================================================
   Mental Math Drill — single file, vanilla JS, offline PWA.
   Storage keys are versioned (v1) so the schema can evolve later.
   ========================================================================= */

const K = {
  stats: "mathdrill.v1.stats",   // { statKey: {correct, wrong} }
  hist:  "mathdrill.v1.history",  // [ {ts, mode, range, op, score, total, timeMs} ]  (max 10)
  prefs: "mathdrill.v1.prefs"     // { range, mode, op }
};

function load(key, def){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch(e){ return def; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;

/* -------------------------------------------------------------------------
   OPERATIONS — the extension point.
   Every operation implements the same small interface, and the rest of the
   app only ever talks to the *active* operation through it. To add a new
   operation (division, percentages, fractions), add an entry here and a chip
   in OP_ORDER below — no other code needs to change.

     enumerate(min,max) -> [ {answer, key, ...operands} ]
         The full set of DISTINCT problems for a range. Used both to draw
         problems from and to weight them by past mistakes. `key` is the
         canonical id used for mistake tracking (so e.g. 7x8 and 8x7 count
         as the same fact for multiplication).

     display(p) -> string
         How to render a chosen problem. May randomize presentation
         (e.g. operand order) without changing the canonical key.

     missLabel(key) -> string
         Pretty version of a stored key for the "Missed" list.
   ------------------------------------------------------------------------- */
const OPS = {
  mul: {
    symbol: "×",
    enumerate(min, max){
      const out = [];
      for (let i = min; i <= max; i++){
        for (let j = i; j <= max; j++){      // i<=j -> commutative pairs only
          out.push({ a:i, b:j, answer:i*j, key:`mul:${i}x${j}` });
        }
      }
      return out;
    },
    display(p){
      // randomize operand order for presentation; answer/key unchanged
      return Math.random() < 0.5 ? `${p.a} × ${p.b}` : `${p.b} × ${p.a}`;
    },
    missLabel(key){
      const [a,b] = key.slice(4).split("x");
      return `${a} × ${b}`;
    },
    // which grid coordinates this problem occupies, so fact selection stays
    // op-agnostic (a future op maps its own operands onto the same grid)
    pairOf(p){ return [p.a, p.b]; },

    /* ---- answer model ----
       slots  : how many numbers the user enters
       maxLen : digit cap per slot
       check  : "correct" | "partial" | "wrong" | "pending", after every keypress
                "partial" = a right answer with more still owed on this problem
       reveal : what "Show answer" displays AND what the user must type back */
    slots: 1,
    maxLen: [4],
    check(slots, cur){
      const ans = String(cur.answer), v = slots[0];
      if (v === ans) return "correct";
      if (v.length >= ans.length) return "wrong";
      return "pending";
    },
    reveal(cur){ return String(cur.answer); }
  },

  /* Factor recall: shown a product, enter the two factors (smaller first).
     A product can have several factorisations, so `pairs` carries every
     SELECTED pair for that product and any one of them is accepted. Stats key
     on the product, so the tracker learns "slow to decompose 56", and the
     `fac:` prefix keeps this pool fully independent of `mul:`. */
  fac: {
    symbol: "×",
    enumerate(min, max){
      const out = [];
      for (let i = min; i <= max; i++)
        for (let j = i; j <= max; j++)
          out.push({ a:i, b:j, answer:i*j, key:`fac:${i*j}` });
      return out;
    },
    display(p){ return String(p.answer); },
    missLabel(key){ return key.slice(4); },
    pairOf(p){ return [p.a, p.b]; },

    slots: 2,
    maxLen: [2, 2],
    check(slots, cur){
      const [sa, sb] = slots;
      if (sa === "") return "pending";
      const a = Number(sa);
      /* Partners of `a` among the pairs still OWED. Already-found pairs are
         excluded, so re-entering one reads as wrong rather than as progress. */
      const partners = [];
      cur.pairs.forEach(([x,y]) => {
        if (cur.found.has(pairKey(x,y))) return;
        if (x === a) partners.push(y);
        else if (y === a) partners.push(x);
      });
      if (!partners.length) return sb === "" ? "pending" : "wrong";
      if (sb === "") return "pending";
      const hit = partners.find(v => String(v) === sb);
      if (hit !== undefined){
        // last one owed finishes the problem; anything earlier is partial
        return cur.found.size + 1 >= cur.pairs.length ? "correct" : "partial";
      }
      if (partners.some(v => String(v).startsWith(sb))) return "pending";
      return "wrong";
    },
    // called on "partial" to bank the pair just entered
    record(slots, cur){ cur.found.add(pairKey(Number(slots[0]), Number(slots[1]))); },
    reveal(cur){
      return cur.pairs.filter(([a,b]) => !cur.found.has(pairKey(a,b)))
                      .map(([a,b]) => `${a} × ${b}`).join(",  ");
    }
  }

  /* Example of a future, non-commutative operation:
  ,div: {
    symbol: "÷",
    enumerate(min,max){
      const out=[];
      for(let i=min;i<=max;i++) for(let j=min;j<=max;j++){
        out.push({a:i*j, b:i, answer:j, key:`div:${i*j}/${i}`});
      }
      return out;
    },
    display(p){ return `${p.a} ÷ ${p.b}`; },         // order is fixed for division
    missLabel(key){ const [a,b]=key.slice(4).split("/"); return `${a} ÷ ${b}`; }
  }
  */
};
const OP_ORDER = ["mul","fac"];           // operations exposed in the UI, in order
const OP_NAMES = { mul:"Multiply", fac:"Factor", div:"Divide", pct:"Percent", frac:"Fraction" };

/* Facts are chosen individually on a MAX x MAX grid rather than by range.
   Multiplication is commutative, so a fact is canonicalised to a<=b ("7x8");
   the grid simply paints both mirror cells from that one key. */
const MAX = 15;
const N_FACTS = (MAX * (MAX + 1)) / 2;
const PRESETS = { "1-10":10, "1-12":12, "1-15":15 };
const PRESET_ORDER = ["1-10","1-12","1-15"];

const pairKey = (a,b) => a <= b ? `${a}x${b}` : `${b}x${a}`;
function presetFacts(hi){
  const out = [];
  for (let i = 1; i <= hi; i++) for (let j = i; j <= hi; j++) out.push(`${i}x${j}`);
  return out;
}
/* A mode pairs two INDEPENDENT axes:
     format    -> session shape: "timed" (60s, count correct) or "fixed" (100q, time it)
     selection -> how problems are drawn: a key into SELECT (weight functions)
   This keeps "what scores/ends a session" separate from "which problems appear",
   so e.g. a fixed-focus mode later is a one-line addition, not a refactor. */
const MODES = {
  timed: { label:"Timed", format:"timed", selection:"normal"  },
  fixed: { label:"Fixed", format:"fixed", selection:"uniform" },
  focus: { label:"Focus", format:"timed", selection:"focus"   }
};
const MODE_ORDER = ["timed","fixed","focus"];

const TIMED_MS = 60000;
const FIXED_Q  = 100;
const MISTAKE_MAX_BOOST = 2;   // normal weight = 1 + 2*missRate -> up to ~3x for always-missed

function missRate(s){
  if (!s) return 0;
  const att = s.correct + s.wrong;
  return att > 0 ? s.wrong / att : 0;
}

/* SELECT: per-problem weight functions, chosen by a mode's `selection`.
     uniform -> flat draw over the selected pool; history is ignored entirely.
                Used by Fixed so a 100-question run is a stable benchmark that
                doesn't drift as the mistake log fills up.
     normal  -> gentle 1..3 nudge toward missed facts, full coverage.
     focus   -> missed facts dominate by volume x rate; clean facts keep a small
                0.2 floor so you still get coverage and can confirm fixes.
   normal/focus degrade gracefully: with zero recorded misses their weights
   flatten and the draw collapses to uniform (no empty-mode edge case). */
const SELECT = {
  uniform: () => 1,
  normal:  (p, s) => 1 + MISTAKE_MAX_BOOST * missRate(s),
  focus:   (p, s) => 0.2 + (s ? s.wrong * (1 + missRate(s)) : 0)
};
function modeFormat(key){ return MODES[key] ? MODES[key].format : (key === "fixed" ? "fixed" : "timed"); }

/* ---------------- preferences ---------------- */
let prefs = load(K.prefs, {});
if (!MODES[prefs.mode]) prefs.mode = "timed";
if (!OPS[prefs.op])     prefs.op   = "mul";

/* Migration: v1 prefs stored a fixed {range:"1-12"}. Convert it once into an
   equivalent explicit selection, clamped to the grid. Stats/history keep their
   own schema and are deliberately untouched. */
if (!Array.isArray(prefs.facts)){
  const hi = Math.min(parseInt(String(prefs.range || "1-12").split("-")[1], 10) || 12, MAX);
  prefs.facts = presetFacts(hi);
}
delete prefs.range;

const facts = new Set(prefs.facts.filter(k => {
  const [a,b] = String(k).split("x").map(Number);
  return a >= 1 && b >= a && b <= MAX;
}));
function saveFacts(){ prefs.facts = [...facts]; save(K.prefs, prefs); }
saveFacts();

/* If the selection is exactly a preset, name it; otherwise it's custom. */
function presetMatch(){
  for (const k of PRESET_ORDER){
    const f = presetFacts(PRESETS[k]);
    if (facts.size === f.length && f.every(x => facts.has(x))) return k;
  }
  return null;
}
function selectionLabel(){
  const m = presetMatch();
  return m ? m : `${facts.size} facts`;
}

/* ---------------- session state ---------------- */
let S = null;

const el = id => document.getElementById(id);

/* ============================ HOME ============================ */
function renderChips(containerId, order, labelMap, selectedKey, onPick){
  const c = el(containerId);
  c.innerHTML = "";
  order.forEach(key => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = labelMap[key];
    b.setAttribute("aria-pressed", key === selectedKey ? "true" : "false");
    b.addEventListener("click", () => onPick(key));
    c.appendChild(b);
  });
}

function renderHome(){
  const sum = el("factSummary");
  const m = presetMatch();
  sum.classList.toggle("none", facts.size === 0);
  sum.textContent = facts.size === 0
    ? "No facts selected"
    : `${facts.size} facts · ${m ? m.replace("-","–") : "custom"}`;
  el("startBtn").disabled = facts.size === 0;

  renderChips("opChips", OP_ORDER, OP_NAMES, prefs.op, k => { prefs.op = k; save(K.prefs, prefs); renderHome(); });

  const modeLabels = {}; MODE_ORDER.forEach(m2 => modeLabels[m2] = MODES[m2].label);
  renderChips("modeChips", MODE_ORDER, modeLabels, prefs.mode, k => { prefs.mode = k; save(K.prefs, prefs); renderHome(); });
  renderHistory();
}

function fmtTime(ms){
  const s = Math.round(ms/1000);
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined, { month:"short", day:"numeric" });
}

function renderHistory(){
  const list = el("histList");
  const hist = load(K.hist, []);
  if (!hist.length){ list.innerHTML = '<div class="histempty">No sessions yet.</div>'; return; }
  list.innerHTML = "";
  hist.forEach(h => {
    const row = document.createElement("div");
    row.className = "histrow";
    const range = h.range.replace("-","–");
    const fmt = h.format || modeFormat(h.mode);
    const result = fmt === "timed" ? `${h.score} correct` : fmtTime(h.timeMs);
    row.innerHTML =
      `<span class="meta num">${fmtDate(h.ts)} · ${OP_NAMES[h.op] || "Multiply"} · ${range}</span>` +
      `<span class="res num">${result}</span>`;
    list.appendChild(row);
  });
}

/* ============================ DRILL ============================ */
function buildPool(){
  const op = OPS[prefs.op];
  return op.enumerate(1, MAX).filter(p => {
    const [a,b] = op.pairOf(p);
    return facts.has(pairKey(a,b));
  });
}

/* key -> [[a,b],...] over the SELECTED pool. For factoring this is the set of
   accepted answers per product; several pool entries share one key (12 arrives
   from 2x6 and 3x4), which also makes ambiguous products appear proportionally
   more often. */
function indexPairs(pool, op){
  const m = new Map();
  pool.forEach(p => {
    const arr = m.get(p.key) || m.set(p.key, []).get(p.key);
    arr.push(op.pairOf(p));
  });
  return m;
}

/* Weighted draw. The weight function is chosen by the mode's `selection`
   (see SELECT). If every weight comes out 0 (e.g. focus with no misses yet),
   we fall back to uniform so the draw never stalls. The immediately previous
   problem is never repeated. */
function pickWeighted(pool, stats, lastKey, selection){
  const wf = SELECT[selection] || SELECT.normal;
  const w = new Array(pool.length);
  let total = 0;
  for (let i = 0; i < pool.length; i++){
    let wt = wf(pool[i], stats[pool[i].key]);
    if (!(wt > 0)) wt = 0;                 // guard NaN / negatives
    w[i] = wt; total += wt;
  }
  if (total <= 0){ for (let i = 0; i < pool.length; i++) w[i] = 1; total = pool.length; }
  for (let tries = 0; tries < 8; tries++){
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < pool.length; i++){ r -= w[i]; if (r <= 0){ idx = i; break; } }
    if (pool.length === 1 || pool[idx].key !== lastKey) return pool[idx];
  }
  return pool[0];
}

function startSession(){
  const m = MODES[prefs.mode] || MODES.timed;
  const pool0 = buildPool();
  S = {
    pool: pool0,
    pairs: indexPairs(pool0, OPS[prefs.op]),
    stats: load(K.stats, {}),
    mode: prefs.mode,
    format: m.format,        // "timed" | "fixed"
    selection: m.selection,  // key into SELECT
    op: prefs.op,
    score: 0,            // first-attempt-correct count
    answered: 0,         // problems completed
    slots: ["",""],
    slot: 0,
    flash: null,
    current: null,
    attemptWrong: false,
    revealed: false,
    missed: new Set(),   // statKeys missed (first attempt) this session
    startTs: Date.now(),
    endTs: m.format === "timed" ? Date.now() + TIMED_MS : null,
    qIndex: 0,
    timer: null
  };
  nextProblem();
  el("opKey").classList.toggle("hidden", OPS[prefs.op].slots < 2);
  el("scoreLabel").textContent = "0";
  showView("drill");
  renderDrill();
  if (S.format === "timed"){
    updateTimer();
    S.timer = setInterval(updateTimer, 200);
  }
}

function nextProblem(){
  const lastKey = S.current ? S.current.key : null;
  const p = pickWeighted(S.pool, S.stats, lastKey, S.selection);
  S.current = {
    key: p.key, answer: p.answer, disp: OPS[S.op].display(p),
    pairs: S.pairs.get(p.key) || [OPS[S.op].pairOf(p)],
    found: new Set()
  };
  S.slots = ["",""];
  S.slot = 0;
  S.attemptWrong = false;
  S.revealed = false;
}

function renderDrill(){
  el("problem").textContent = S.current.disp;
  renderAnswer();
  renderHint();
  el("showBtn").classList.toggle("hidden", S.revealed);
  if (S.format === "fixed"){
    el("status").classList.remove("timer","low");
    el("status").textContent = `${S.qIndex + 1}/${FIXED_Q}`;
  }
}

function renderAnswer(bad){
  const a = el("answer");
  const op = OPS[S.op];
  if (S.flash){ clearTimeout(S.flash); S.flash = null; }
  const blank = S.slots.slice(0, op.slots).every(v => v === "");
  a.className = "answerbox num" + (blank ? " empty" : "") + (bad ? " bad" : "");
  if (op.slots === 1){
    a.textContent = S.slots[0] === "" ? "·" : S.slots[0];
  } else {
    const cell = i => S.slots[i] !== "" ? S.slots[i] : (S.slot === i ? "·" : "\u2013");
    a.textContent = `${cell(0)} ${op.symbol} ${cell(1)}`;
  }
}

function updateTimer(){
  const left = Math.max(0, S.endTs - Date.now());
  const secs = Math.ceil(left / 1000);
  const st = el("status");
  st.classList.add("timer");
  st.classList.toggle("low", secs <= 10);
  st.textContent = String(secs);
  if (left <= 0) finish();
}

function press(d){
  const op = OPS[S.op], i = S.slot;
  if (S.slots[i].length >= op.maxLen[i]) return;
  S.slots[i] += d;
  evaluate();
}

/* Advance to the second slot. Needed because after typing "1" the app cannot
   know whether the factor is 1 or 12, so it cannot auto-commit the way
   single-answer mode does. */
function nextSlot(){
  if (OPS[S.op].slots < 2) return;
  if (S.slot === 0 && S.slots[0] !== ""){ S.slot = 1; renderAnswer(false); }
}

function backspace(){
  const i = S.slot;
  if (S.slots[i] === "" && i > 0) S.slot = 0;
  else S.slots[i] = S.slots[i].slice(0, -1);
  renderAnswer(false);
  renderHint();
}

function renderHint(){
  el("hint").innerHTML = S.revealed ? `= ${OPS[S.op].reveal(S.current)}` : "&nbsp;";
}

function evaluate(){
  const op = OPS[S.op];
  const r = op.check(S.slots, S.current);
  if (r === "correct") onCorrect();
  else if (r === "partial") onPartial();
  else if (r === "wrong") onWrong();
  else renderAnswer(false);
}

/* A correct pair on a product that still owes more. Bank it, flash the box
   green, reset for the next entry — deliberately with no count of what's left. */
function onPartial(){
  OPS[S.op].record(S.slots, S.current);
  S.slots = ["",""];
  S.slot = 0;
  const a = el("answer");
  a.className = "answerbox num good";
  a.textContent = "\u00b7";
  clearTimeout(S.flash);
  S.flash = setTimeout(() => renderAnswer(false), 260);
}

function bumpStat(key, field){
  const s = S.stats[key] || (S.stats[key] = { correct:0, wrong:0 });
  s[field]++;
  save(K.stats, S.stats);                  // persist immediately so misses survive a quit
}

function onCorrect(){
  if (!S.attemptWrong){ bumpStat(S.current.key, "correct"); S.score++; el("scoreLabel").textContent = String(S.score); }
  S.answered++;
  advance();
}

function onWrong(){
  // a wrong guess counts as a miss (first attempt only) but does NOT reveal;
  // clear and let them retry. Revealing is opt-in via the Show answer button.
  if (!S.attemptWrong){
    bumpStat(S.current.key, "wrong");
    S.missed.add(S.current.key);
    S.attemptWrong = true;
  }
  S.slots = ["",""];
  S.slot = 0;
  renderAnswer(true);
}

function showAnswer(){
  // blanking counts as a miss too (guarded so a prior wrong guess isn't double-counted)
  if (!S.attemptWrong){
    bumpStat(S.current.key, "wrong");
    S.missed.add(S.current.key);
    S.attemptWrong = true;
  }
  S.revealed = true;
  S.slots = ["",""];
  S.slot = 0;
  el("hint").innerHTML = `= ${OPS[S.op].reveal(S.current)}`;
  el("showBtn").classList.add("hidden");
  renderAnswer(false);   // user types the revealed answer to advance
}

function advance(){
  if (S.format === "fixed"){
    S.qIndex++;
    if (S.qIndex >= FIXED_Q){ finish(); return; }
  }
  nextProblem();
  renderDrill();
}

function finish(){
  if (S.timer){ clearInterval(S.timer); S.timer = null; }
  const total  = S.format === "timed" ? S.answered : FIXED_Q;
  const timeMs = S.format === "timed" ? TIMED_MS : (Date.now() - S.startTs);
  const entry = {
    ts: Date.now(), mode: S.mode, format: S.format, range: selectionLabel(), op: S.op,
    score: S.score, total, timeMs
  };
  const hist = load(K.hist, []);
  hist.unshift(entry);
  if (hist.length > 10) hist.length = 10;
  save(K.hist, hist);
  renderResults(entry, [...S.missed]);
  showView("results");
}

function quitDrill(){
  if (S && S.timer){ clearInterval(S.timer); S.timer = null; }
  // stats (incl. misses) were already persisted; a quit is not logged as a session
  renderHome();
  showView("home");
}

/* ============================ RESULTS ============================ */
function renderResults(entry, missedKeys){
  const acc = entry.total ? Math.round((entry.score / entry.total) * 100) : 0;
  if (entry.format === "timed"){
    el("rBig").textContent = String(entry.score);
    el("rLabel").textContent = entry.mode === "focus" ? "correct in 60 seconds (focus)" : "correct in 60 seconds";
    el("rAcc").textContent = entry.total ? `${entry.score}/${entry.total} first try · ${acc}%` : "no answers";
  } else {
    el("rBig").textContent = fmtTime(entry.timeMs);
    el("rLabel").textContent = "for 100 questions";
    el("rAcc").textContent = `${entry.score}/100 first try · ${acc}%`;
  }

  const label = OPS[entry.op] ? OPS[entry.op].missLabel : OPS.mul.missLabel;
  const wrap = el("rMissed");
  wrap.innerHTML = "";
  if (!missedKeys.length){
    wrap.innerHTML = '<span class="nomiss">None — clean run.</span>';
  } else {
    missedKeys.forEach(k => {
      const span = document.createElement("span");
      span.className = "miss num";
      span.textContent = label(k);
      wrap.appendChild(span);
    });
  }
}

/* ============================ SETTINGS ============================ */
/* The grid is built once; selection changes only repaint classes. Cells are
   painted from the canonical a<=b key, so both mirror halves stay in sync
   without any extra bookkeeping. */
function buildGrid(){
  const g = el("fgrid");
  g.innerHTML = "";

  const corner = document.createElement("button");
  corner.className = "fcorner"; corner.id = "fAll";
  corner.textContent = "×";
  corner.setAttribute("aria-label", "Select all or clear");
  g.appendChild(corner);

  for (let c = 1; c <= MAX; c++){
    const h = document.createElement("button");
    h.className = "fhead num"; h.textContent = c; h.dataset.line = c;
    h.setAttribute("aria-label", `Toggle column ${c}`);
    g.appendChild(h);
  }
  for (let r = 1; r <= MAX; r++){
    const h = document.createElement("button");
    h.className = "fhead num"; h.textContent = r; h.dataset.line = r;
    h.setAttribute("aria-label", `Toggle row ${r}`);
    g.appendChild(h);
    for (let c = 1; c <= MAX; c++){
      const b = document.createElement("button");
      b.className = "fcell"; b.dataset.r = r; b.dataset.c = c;
      b.setAttribute("aria-label", `${r} × ${c}`);
      g.appendChild(b);
    }
  }
}

function paintGrid(){
  el("fgrid").querySelectorAll(".fcell").forEach(b => {
    b.classList.toggle("on", facts.has(pairKey(+b.dataset.r, +b.dataset.c)));
  });
  el("setCount").textContent = String(facts.size);
  const presetLabels = {}; PRESET_ORDER.forEach(k => presetLabels[k] = k.replace("-","–"));
  renderChips("presetChips", PRESET_ORDER, presetLabels, presetMatch(), k => {
    facts.clear();
    presetFacts(PRESETS[k]).forEach(f => facts.add(f));
    saveFacts(); paintGrid();
  });
}

function lineKeys(n){
  const out = [];
  for (let i = 1; i <= MAX; i++) out.push(pairKey(n, i));
  return out;
}

el("fgrid").addEventListener("click", e => {
  const cell = e.target.closest(".fcell");
  if (cell){
    const k = pairKey(+cell.dataset.r, +cell.dataset.c);
    facts.has(k) ? facts.delete(k) : facts.add(k);
  } else if (e.target.closest("#fAll")){
    // all -> none, anything else -> all
    if (facts.size === N_FACTS) facts.clear();
    else presetFacts(MAX).forEach(f => facts.add(f));
  } else {
    const h = e.target.closest(".fhead");
    if (!h) return;
    const ks = lineKeys(+h.dataset.line);
    const full = ks.every(k => facts.has(k));
    ks.forEach(k => full ? facts.delete(k) : facts.add(k));
  }
  saveFacts();
  paintGrid();
});

function openSettings(){ paintGrid(); showView("settings"); }
function closeSettings(){ renderHome(); showView("home"); }

/* ============================ NAV / WIRING ============================ */
function showView(name){
  ["home","settings","drill","results"].forEach(v => el(v).classList.toggle("active", v === name));
}

// number pad (event delegation)
el("pad").addEventListener("click", e => {
  const btn = e.target.closest("button[data-k]");
  if (!btn) return;
  const k = btn.dataset.k;
  if (k === "back") backspace();
  else if (k === "next") nextSlot();
  else press(k);
});

// physical keyboard (handy for desktop testing)
document.addEventListener("keydown", e => {
  if (!el("drill").classList.contains("active")) return;
  if (e.key >= "0" && e.key <= "9") press(e.key);
  else if (e.key === "Backspace") backspace();
  else if (e.key === "x" || e.key === "*" || e.key === " " || e.key === "Enter") { e.preventDefault(); nextSlot(); }
  else if (e.key === "Escape") quitDrill();
  else if (e.key === "?" || e.key === "/") showAnswer();
});

el("showBtn").addEventListener("click", showAnswer);

el("startBtn").addEventListener("click", () => { if (facts.size) startSession(); });
el("gearBtn").addEventListener("click", openSettings);
el("setBack").addEventListener("click", closeSettings);
el("setDone").addEventListener("click", closeSettings);
el("quitBtn").addEventListener("click", quitDrill);
el("rAgain").addEventListener("click", startSession);
el("rHome").addEventListener("click", () => { renderHome(); showView("home"); });
el("resetBtn").addEventListener("click", () => {
  if (confirm("Clear all session history and mistake tracking?")){
    save(K.stats, {});
    save(K.hist, []);
    renderHome();
  }
});

// initial paint
buildGrid();
renderHome();

// offline support
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
